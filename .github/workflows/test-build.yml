name: Test build

on:
  push:
    paths:
      - "src/ThermoScanHeaderExtractor/**/*.cs"
      - "src/ThermoScanHeaderExtractor/**/*.csproj"
      - "third_party/Thermo.RawFileReader/thermo-package-source.json"
      - "third_party/Thermo.RawFileReader/RawFileReader-DistributionLicense.*"
      - "scripts/build.ps1"
      - "scripts/get-thermo-packages.ps1"
      - "THIRD-PARTY-NOTICES.txt"
      - "tests/data/thermo/**"
      - "nuget.config"
      - ".github/workflows/test-build.yml"
  pull_request:
    paths:
      - "src/ThermoScanHeaderExtractor/**/*.cs"
      - "src/ThermoScanHeaderExtractor/**/*.csproj"
      - "third_party/Thermo.RawFileReader/thermo-package-source.json"
      - "third_party/Thermo.RawFileReader/RawFileReader-DistributionLicense.*"
      - "scripts/build.ps1"
      - "scripts/get-thermo-packages.ps1"
      - "THIRD-PARTY-NOTICES.txt"
      - "tests/data/thermo/**"
      - "nuget.config"
      - ".github/workflows/test-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Build and extract sample (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, runtime: win-x64, executable: ThermoScanHeaderExtractor.exe }
          - { os: windows-11-arm, runtime: win-arm64, executable: ThermoScanHeaderExtractor.exe }
          - { os: ubuntu-latest, runtime: linux-x64, executable: ThermoScanHeaderExtractor }
          - { os: ubuntu-24.04-arm, runtime: linux-arm64, executable: ThermoScanHeaderExtractor }
          - { os: macos-15-intel, runtime: osx-x64, executable: ThermoScanHeaderExtractor }
          - { os: macos-latest, runtime: osx-arm64, executable: ThermoScanHeaderExtractor }

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build with build.ps1
        shell: pwsh
        run: ./scripts/build.ps1 -Runtime ${{ matrix.runtime }} -OutputDirectory ./artifacts/ci

      - name: Extract and validate sample RAW file
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The tool writes UTF-8; read its output as UTF-8 too.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $outputDirectory = "./artifacts/ci"
          $executable = Join-Path $outputDirectory "${{ matrix.executable }}"
          if (-not (Test-Path $executable -PathType Leaf)) {
            throw "Published executable was not found: $executable"
          }

          $fixture = "./tests/data/thermo/exploris480_ms1_dia_3cycles.raw"
          if (-not (Test-Path $fixture -PathType Leaf)) {
            throw "The Thermo sample fixture is missing: $fixture"
          }

          $versionOutput = @(& $executable --version)
          if ($LASTEXITCODE -ne 0) {
            throw "The executable's --version command failed with exit code $LASTEXITCODE."
          }
          if ($versionOutput.Count -ne 1 -or $versionOutput[0] -notmatch '^\d+\.\d+\.\d+$') {
            throw "Expected --version to print one semantic version line; got: $($versionOutput -join ' | ')"
          }

          $configDirectory = switch ($env:RUNNER_OS) {
            "Windows" { Join-Path $env:LOCALAPPDATA "perutzms/ThermoScanHeaderExtractor" }
            "macOS" { Join-Path $HOME "Library/Application Support/ThermoScanHeaderExtractor" }
            default {
              $xdgConfigHome = if ($env:XDG_CONFIG_HOME) { $env:XDG_CONFIG_HOME } else { Join-Path $HOME ".config" }
              Join-Path $xdgConfigHome "ThermoScanHeaderExtractor"
            }
          }
          $marker = Join-Path $configDirectory ".thermo-license-accepted"

          # --license-status must exit with the expected code, print only the marker path on
          # standard output (nothing for exit code 5), and not create or change the marker.
          function Assert-LicenseStatus([int]$expectedExitCode, [string]$expectedMarker) {
            $markerPath = if ($expectedMarker) { $expectedMarker } else { $marker }
            $stateBefore = if (Test-Path $markerPath) { (Get-FileHash $markerPath).Hash } else { "missing" }
            $stdout = @(& $executable --license-status 2>$null)
            $exitCode = $LASTEXITCODE
            $stateAfter = if (Test-Path $markerPath) { (Get-FileHash $markerPath).Hash } else { "missing" }
            if ($exitCode -ne $expectedExitCode) {
              throw "Expected --license-status to exit with $expectedExitCode; got $exitCode."
            }
            if ($expectedMarker) {
              $comparison = if ($IsWindows) { [StringComparison]::OrdinalIgnoreCase } else { [StringComparison]::Ordinal }
              if ($stdout.Count -ne 1 -or -not [string]::Equals([IO.Path]::GetFullPath($stdout[0]), [IO.Path]::GetFullPath($expectedMarker), $comparison)) {
                throw "Expected --license-status to print only $expectedMarker; got: $($stdout -join ' | ')"
              }
            }
            elseif ($stdout.Count -ne 0) {
              throw "Expected no standard output from --license-status; got: $($stdout -join ' | ')"
            }
            if ($stateAfter -ne $stateBefore) {
              throw "--license-status changed $markerPath."
            }
          }

          # With THERMO_SCAN_HEADER_EXTRACTOR_CONFIG_DIR set, every license step uses only that folder.
          # These checks run before the default acceptance below, so a successful extraction here
          # can only come from the acceptance file in the override folder.
          $markerStateBefore = if (Test-Path $marker) { (Get-FileHash $marker).Hash } else { "missing" }
          Assert-LicenseStatus $(if ($markerStateBefore -eq "missing") { 4 } else { 0 }) $marker
          $licenseRoot = Join-Path $env:RUNNER_TEMP "thermoscan-license"
          # The non-ASCII name checks that paths are written as UTF-8.
          $overrideDirectory = Join-Path $licenseRoot "konfig-ü"
          $overrideMarker = Join-Path $overrideDirectory ".thermo-license-accepted"
          $overrideOutput = Join-Path $licenseRoot "output"
          Remove-Item -Recurse -Force $licenseRoot -ErrorAction SilentlyContinue
          try {
            $env:THERMO_SCAN_HEADER_EXTRACTOR_CONFIG_DIR = $overrideDirectory
            Assert-LicenseStatus 4 $overrideMarker
            if (Test-Path $overrideDirectory) {
              throw "--license-status created the override folder."
            }
            $output = & $executable $fixture -o $overrideOutput 2>&1
            if ($LASTEXITCODE -ne 4) {
              throw "Expected exit code 4 before acceptance in the override folder; got ${LASTEXITCODE}: $($output -join ' | ')"
            }
            if (-not ($output -join "`n").Contains($overrideMarker)) {
              throw "The message about missing acceptance does not name $overrideMarker`: $($output -join ' | ')"
            }
            $null = & $executable --agree-to-terms
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $overrideMarker -PathType Leaf)) {
              throw "--agree-to-terms did not create $overrideMarker (exit code $LASTEXITCODE)."
            }
            Assert-LicenseStatus 0 $overrideMarker
            & $executable $fixture -o $overrideOutput
            if ($LASTEXITCODE -ne 0) {
              throw "Extraction with acceptance in the override folder failed with exit code $LASTEXITCODE."
            }

            # Invalid values: a relative path, a path without a drive letter on Windows, and a file.
            $overrideMarkerState = (Get-FileHash $overrideMarker).Hash
            $invalidValues = @("relative-config", $overrideMarker)
            if ($env:RUNNER_OS -eq "Windows") {
              $invalidValues += "\no-drive-config"
            }
            foreach ($value in $invalidValues) {
              $env:THERMO_SCAN_HEADER_EXTRACTOR_CONFIG_DIR = $value
              $output = & $executable --agree-to-terms 2>&1
              if ($LASTEXITCODE -ne 5) {
                throw "Expected exit code 5 from --agree-to-terms with the override '$value'; got ${LASTEXITCODE}: $($output -join ' | ')"
              }
              $output = & $executable $fixture -o $overrideOutput 2>&1
              if ($LASTEXITCODE -ne 5) {
                throw "Expected exit code 5 from extraction with the override '$value'; got ${LASTEXITCODE}: $($output -join ' | ')"
              }
              Assert-LicenseStatus 5 ""
            }
            if ((Test-Path "relative-config") -or (Test-Path "\no-drive-config")) {
              throw "An invalid override path created a folder."
            }
            if ((Get-FileHash $overrideMarker).Hash -ne $overrideMarkerState) {
              throw "Using the acceptance file as the override value changed it."
            }
          }
          finally {
            Remove-Item Env:THERMO_SCAN_HEADER_EXTRACTOR_CONFIG_DIR -ErrorAction SilentlyContinue
          }
          $markerStateAfter = if (Test-Path $marker) { (Get-FileHash $marker).Hash } else { "missing" }
          if ($markerStateAfter -ne $markerStateBefore) {
            throw "The per-user acceptance file changed while THERMO_SCAN_HEADER_EXTRACTOR_CONFIG_DIR was set: $marker"
          }

          # Only the printed license text is suppressed; extraction output stays in the log.
          $null = & $executable --agree-to-terms
          if ($LASTEXITCODE -ne 0) {
            throw "The executable could not record acceptance of the Thermo terms (exit code $LASTEXITCODE)."
          }
          if (-not (Test-Path $marker -PathType Leaf)) {
            throw "The Thermo license acceptance marker was not created in the per-user configuration directory: $marker"
          }
          Assert-LicenseStatus 0 $marker

          # Now that the per-user acceptance exists, an override folder without an acceptance file
          # must still give 4 (no fallback).
          $emptyOverrideDirectory = Join-Path $licenseRoot "unaccepted-config"
          try {
            $env:THERMO_SCAN_HEADER_EXTRACTOR_CONFIG_DIR = $emptyOverrideDirectory
            Assert-LicenseStatus 4 (Join-Path $emptyOverrideDirectory ".thermo-license-accepted")
            $output = & $executable $fixture -o $overrideOutput 2>&1
            if ($LASTEXITCODE -ne 4) {
              throw "Expected exit code 4 with an override folder without an acceptance file although the per-user acceptance exists; got ${LASTEXITCODE}: $($output -join ' | ')"
            }
            if (-not ($output -join "`n").Contains((Join-Path $emptyOverrideDirectory ".thermo-license-accepted"))) {
              throw "The message about missing acceptance does not name the marker in $emptyOverrideDirectory`: $($output -join ' | ')"
            }
          }
          finally {
            Remove-Item Env:THERMO_SCAN_HEADER_EXTRACTOR_CONFIG_DIR -ErrorAction SilentlyContinue
          }
          if (Test-Path (Join-Path $outputDirectory ".thermo-license-accepted")) {
            throw "A license acceptance marker was unexpectedly created beside the published application."
          }
          foreach ($fileName in @("LICENSE.txt", "RawFileReader-DistributionLicense.md", "RawFileReader-DistributionLicense.doc", "THIRD-PARTY-NOTICES.txt", "dotnet-LICENSE.txt", "dotnet-THIRD-PARTY-NOTICES.txt")) {
            if (-not (Test-Path (Join-Path $outputDirectory $fileName) -PathType Leaf)) {
              throw "Expected license file was not copied to the publish directory: $fileName"
            }
          }

          $testRoot = Join-Path $env:RUNNER_TEMP "thermoscan-cross-platform"
          $parquetDirectory = Join-Path $testRoot "parquet"
          $tsvDirectory = Join-Path $testRoot "tsv"
          New-Item -ItemType Directory -Force -Path $parquetDirectory, $tsvDirectory | Out-Null
          # An existing output file must be replaced by the new one.
          Set-Content -Path (Join-Path $parquetDirectory "sample.ms1-trace.parquet") -Value "old output"

          $stderrFile = Join-Path $testRoot "parquet-stderr.txt"
          & $executable $fixture --name sample -o $parquetDirectory 2> $stderrFile
          $exitCode = $LASTEXITCODE
          $stderrText = Get-Content -Raw $stderrFile
          if ($exitCode -ne 0) {
            throw "Parquet extraction failed with exit code ${exitCode}: $stderrText"
          }
          # The fixture has only MS1 and MS2 scans, so no scan is skipped and nothing is reported.
          if (-not [string]::IsNullOrWhiteSpace($stderrText)) {
            throw "Expected no messages on standard error for the sample; got: $stderrText"
          }
          foreach ($fileName in @("sample.ms1-trace.parquet", "sample.msn-trace.parquet")) {
            $outputFile = Join-Path $parquetDirectory $fileName
            if (-not (Test-Path $outputFile -PathType Leaf) -or (Get-Item $outputFile).Length -eq 0) {
              throw "Expected non-empty Parquet output was not produced: $outputFile"
            }
            # Parquet files start and end with the magic bytes "PAR1".
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $outputFile))
            $head = [System.Text.Encoding]::ASCII.GetString($bytes, 0, 4)
            $tail = [System.Text.Encoding]::ASCII.GetString($bytes, $bytes.Length - 4, 4)
            if ($head -ne "PAR1" -or $tail -ne "PAR1") {
              throw "Output is not a complete Parquet file: $outputFile"
            }
          }

          # With --ms1, the MS1 file is written and an existing MSn file is left alone.
          $ms1OnlyDirectory = Join-Path $testRoot "ms1-only"
          New-Item -ItemType Directory -Force -Path $ms1OnlyDirectory | Out-Null
          $otherLevelFile = Join-Path $ms1OnlyDirectory "sample.msn-trace.parquet"
          Set-Content -Path $otherLevelFile -Value "not requested"
          & $executable $fixture --name sample --ms1 -o $ms1OnlyDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "MS1-only extraction failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path (Join-Path $ms1OnlyDirectory "sample.ms1-trace.parquet") -PathType Leaf)) {
            throw "MS1-only extraction did not write the MS1 file."
          }
          if ((Get-Content -Raw $otherLevelFile).Trim() -ne "not requested") {
            throw "MS1-only extraction changed the MSn file, which was not requested."
          }

          & $executable $fixture --name sample --tsv -o $tsvDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "TSV extraction failed with exit code $LASTEXITCODE."
          }
          # TSV lines end with LF on every platform.
          foreach ($fileName in @("sample.ms1-trace.tsv", "sample.msn-trace.tsv")) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path (Join-Path $tsvDirectory $fileName)))
            if ($bytes.Length -eq 0) {
              throw "$fileName is empty."
            }
            if ([Array]::IndexOf($bytes, [byte]13) -ge 0 -or $bytes[-1] -ne 10) {
              throw "Expected LF line endings only in $fileName."
            }
          }
          $ms1Lines = @(Get-Content (Join-Path $tsvDirectory "sample.ms1-trace.tsv"))
          $msnLines = @(Get-Content (Join-Path $tsvDirectory "sample.msn-trace.tsv"))
          $ms1ScanIds = @($ms1Lines | Select-Object -Skip 1 | ForEach-Object { [int](($_ -split "`t")[0]) })
          $msnScanIds = @($msnLines | Select-Object -Skip 1 | ForEach-Object { [int](($_ -split "`t")[0]) })
          $expectedMsnScanIds = @(2..13) + @(15..26) + @(28..39)
          if (($ms1ScanIds -join ",") -ne "1,14,27") {
            throw "Expected MS1 scan IDs 1,14,27; got: $($ms1ScanIds -join ',')"
          }
          $invalidMsnRows = @($msnLines | Select-Object -Skip 1 | Where-Object { ($_ -split "`t")[4] -ne "2" })
          if (($msnScanIds -join ",") -ne ($expectedMsnScanIds -join ",") -or $invalidMsnRows.Count -ne 0) {
            throw "Expected MS2 scan IDs 2-13, 15-26, and 28-39; got: $($msnScanIds -join ',')"
          }

          # Documented exit codes for common failures.
          $errorDirectory = Join-Path $testRoot "errors"
          New-Item -ItemType Directory -Force -Path $errorDirectory | Out-Null
          $existingFile = Join-Path $errorDirectory "existing-file.txt"
          Set-Content -Path $existingFile -Value "not a directory"
          $errorCases = @(
            # If the empty value were dropped, -o would take the fixture path and give 6, not 1.
            @{ Name = "empty -o value"; Arguments = @("-o", "", $fixture); ExitCode = 1 },
            @{ Name = "missing input file"; Arguments = @((Join-Path $errorDirectory "missing.raw")); ExitCode = 2 },
            @{ Name = "input is not a RAW file"; Arguments = @("./tests/data/thermo/README.md", "-o", $errorDirectory); ExitCode = 3 },
            @{ Name = "-o names an existing file"; Arguments = @($fixture, "-o", $existingFile); ExitCode = 6 }
          )
          foreach ($case in $errorCases) {
            $arguments = $case.Arguments
            $output = & $executable @arguments 2>&1
            if ($LASTEXITCODE -ne $case.ExitCode) {
              throw "Expected exit code $($case.ExitCode) for '$($case.Name)'; got ${LASTEXITCODE}: $($output -join ' | ')"
            }
          }
          # GitHub Actions fails a pwsh step if the last native command exited with a code other
          # than 0, even when that code was expected. Reset it after the expected failures above.
          $global:LASTEXITCODE = 0

          $temporaryFiles = @(Get-ChildItem -Force -Recurse -Path $testRoot -Filter "*.tmp")
          if ($temporaryFiles.Count -ne 0) {
            throw "Temporary files were left behind: $($temporaryFiles.FullName -join ', ')"
          }

          Write-Host "Published ${{ matrix.runtime }} executable extracted the sample successfully: 3 MS1 and 36 MS2 scans."

      - name: Set up Python for the time zone and console checks
        if: runner.os == 'Linux' || runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Some callers, such as services, start the tool without a console. It must still
      # work and write UTF-8. Python can start a process with DETACHED_PROCESS; pwsh cannot.
      - name: Check commands without a console
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $executable = "./artifacts/ci/${{ matrix.executable }}"
          $fixture = "./tests/data/thermo/exploris480_ms1_dia_3cycles.raw"
          $checkWithoutConsole = @'
          import os, subprocess, sys
          executable, fixture, root = sys.argv[1:]
          # The non-ASCII folder name checks that output is UTF-8.
          config = os.path.join(root, "konfig-ü")
          marker = os.path.join(config, ".thermo-license-accepted")
          output = os.path.join(root, "output")
          environment = dict(os.environ, THERMO_SCAN_HEADER_EXTRACTOR_CONFIG_DIR=config)

          def run(expected_exit_code, *arguments):
              result = subprocess.run([executable, *arguments], capture_output=True, env=environment,
                                      creationflags=subprocess.DETACHED_PROCESS, timeout=300)
              stdout = result.stdout.decode("utf-8", "replace")
              stderr = result.stderr.decode("utf-8", "replace")
              if result.returncode != expected_exit_code:
                  sys.exit(f"{' '.join(arguments)}: expected exit code {expected_exit_code}, "
                           f"got {result.returncode}: {stderr}")
              if "\ufffd" in stdout + stderr:
                  sys.exit(f"{' '.join(arguments)}: the output is not valid UTF-8.")
              return stdout

          if "©" not in run(0, "help"):
              sys.exit("help did not print the copyright sign as UTF-8.")
          if run(4, "--license-status") != marker + "\r\n":
              sys.exit("--license-status (not accepted) did not print the acceptance file path as UTF-8.")
          run(0, "--agree-to-terms")
          if run(0, "--license-status") != marker + "\r\n":
              sys.exit("--license-status (accepted) did not print the acceptance file path as UTF-8.")
          run(0, fixture, "--name", "sample", "-o", output)
          for name in ("sample.ms1-trace.parquet", "sample.msn-trace.parquet"):
              if not os.path.isfile(os.path.join(output, name)):
                  sys.exit(f"Extraction without a console did not write {name}.")
          print("All commands work without a console.")
          '@
          $root = Join-Path $env:RUNNER_TEMP "no-console"
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          python -c $checkWithoutConsole $executable $fixture $root
          if ($LASTEXITCODE -ne 0) {
            throw "A command failed without a console."
          }

      # RAW files store the clock time of the acquisition PC. The written time must not
      # depend on the time zone of the machine that runs the extraction.
      - name: Check acquisition time under different time zones
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --quiet pyarrow
          if ($LASTEXITCODE -ne 0) {
            throw "Could not install pyarrow."
          }

          $executable = "./artifacts/ci/${{ matrix.executable }}"
          $fixture = "./tests/data/thermo/exploris480_ms1_dia_3cycles.raw"
          $readMetadata = @'
          import sys
          import pyarrow.parquet as pq
          for path in sys.argv[1:]:
              metadata = pq.read_schema(path).metadata
              print(metadata[b'acquisition_start_time'].decode(), metadata[b'source_id'].decode())
          '@

          # Standard UTC offsets in hours; Auckland also moves 2026-09-30T11:46:56 to the next day.
          $expectedOffsets = @{ "UTC" = 0; "Pacific/Auckland" = 12 }
          foreach ($timeZone in @("UTC", "Pacific/Auckland")) {
            $outputDirectory = Join-Path $env:RUNNER_TEMP ("time-zone-" + ($timeZone -replace "/", "-"))
            $env:TZ = $timeZone
            # pwsh runs on .NET, so this proves that .NET sees the time zone set by TZ.
            $offset = pwsh -NoProfile -Command "[TimeZoneInfo]::Local.BaseUtcOffset.TotalHours"
            & $executable $fixture --name sample -o $outputDirectory
            $exitCode = $LASTEXITCODE
            Remove-Item Env:TZ
            if ([double]$offset -ne $expectedOffsets[$timeZone]) {
              throw "TZ=$timeZone had no effect on .NET: the local UTC offset is $offset hours."
            }
            if ($exitCode -ne 0) {
              throw "Extraction under TZ=$timeZone failed with exit code $exitCode."
            }

            $files = @("sample.ms1-trace.parquet", "sample.msn-trace.parquet") | ForEach-Object { Join-Path $outputDirectory $_ }
            $lines = @(python -c $readMetadata @files)
            if ($LASTEXITCODE -ne 0 -or $lines.Count -ne 2) {
              throw "Could not read the Parquet metadata written under TZ=$timeZone."
            }
            foreach ($line in $lines) {
              if ($line -ne "2026-09-30T11:46:56 MA10459C_20260930114656") {
                throw "Under TZ=$timeZone, expected acquisition_start_time 2026-09-30T11:46:56 and source_id MA10459C_20260930114656; got: $line"
              }
            }
            Write-Host "TZ=${timeZone}: acquisition_start_time and source_id are as expected."
          }
