name: Test build

on:
  push:
    paths:
      - "src/ThermoScanHeaderExtractor/**/*.cs"
      - "src/ThermoScanHeaderExtractor/**/*.csproj"
      - "third_party/Thermo.RawFileReader/thermo-package-source.json"
      - "third_party/Thermo.RawFileReader/RawFileReader-DistributionLicense.*"
      - "scripts/build.ps1"
      - "scripts/get-thermo-packages.ps1"
      - "tests/data/thermo/**"
      - "nuget.config"
      - ".github/workflows/test-build.yml"
  pull_request:
    paths:
      - "src/ThermoScanHeaderExtractor/**/*.cs"
      - "src/ThermoScanHeaderExtractor/**/*.csproj"
      - "third_party/Thermo.RawFileReader/thermo-package-source.json"
      - "third_party/Thermo.RawFileReader/RawFileReader-DistributionLicense.*"
      - "scripts/build.ps1"
      - "scripts/get-thermo-packages.ps1"
      - "tests/data/thermo/**"
      - "nuget.config"
      - ".github/workflows/test-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Build and extract sample (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, runtime: win-x64, executable: ThermoScanHeaderExtractor.exe }
          - { os: windows-11-arm, runtime: win-arm64, executable: ThermoScanHeaderExtractor.exe }
          - { os: ubuntu-latest, runtime: linux-x64, executable: ThermoScanHeaderExtractor }
          - { os: ubuntu-24.04-arm, runtime: linux-arm64, executable: ThermoScanHeaderExtractor }
          - { os: macos-15-intel, runtime: osx-x64, executable: ThermoScanHeaderExtractor }
          - { os: macos-latest, runtime: osx-arm64, executable: ThermoScanHeaderExtractor }

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build with build.ps1
        shell: pwsh
        run: ./scripts/build.ps1 -Runtime ${{ matrix.runtime }} -OutputDirectory ./artifacts/ci

      - name: Extract and validate sample RAW file
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outputDirectory = "./artifacts/ci"
          $executable = Join-Path $outputDirectory "${{ matrix.executable }}"
          if (-not (Test-Path $executable -PathType Leaf)) {
            throw "Published executable was not found: $executable"
          }

          $fixture = "./tests/data/thermo/exploris480_ms1_dia_3cycles.raw"
          if (-not (Test-Path $fixture -PathType Leaf)) {
            throw "The Thermo sample fixture is missing: $fixture"
          }

          $versionOutput = @(& $executable --version)
          if ($LASTEXITCODE -ne 0) {
            throw "The executable's --version command failed with exit code $LASTEXITCODE."
          }
          if ($versionOutput.Count -ne 1 -or $versionOutput[0] -notmatch '^\d+\.\d+\.\d+$') {
            throw "Expected --version to print one semantic version line; got: $($versionOutput -join ' | ')"
          }

          # Only the printed license text is suppressed; extraction output stays in the log.
          $null = & $executable --agree-to-terms
          if ($LASTEXITCODE -ne 0) {
            throw "The executable could not record acceptance of the Thermo terms (exit code $LASTEXITCODE)."
          }
          $configDirectory = switch ($env:RUNNER_OS) {
            "Windows" { Join-Path $env:LOCALAPPDATA "perutzms/ThermoScanHeaderExtractor" }
            "macOS" { Join-Path $HOME "Library/Application Support/ThermoScanHeaderExtractor" }
            default {
              $xdgConfigHome = if ($env:XDG_CONFIG_HOME) { $env:XDG_CONFIG_HOME } else { Join-Path $HOME ".config" }
              Join-Path $xdgConfigHome "ThermoScanHeaderExtractor"
            }
          }
          $marker = Join-Path $configDirectory ".thermo-license-accepted"
          if (-not (Test-Path $marker -PathType Leaf)) {
            throw "The Thermo license acceptance marker was not created in the per-user configuration directory: $marker"
          }
          if (Test-Path (Join-Path $outputDirectory ".thermo-license-accepted")) {
            throw "A license acceptance marker was unexpectedly created beside the published application."
          }
          foreach ($fileName in @("LICENSE.txt", "RawFileReader-DistributionLicense.md", "RawFileReader-DistributionLicense.doc")) {
            if (-not (Test-Path (Join-Path $outputDirectory $fileName) -PathType Leaf)) {
              throw "Expected license file was not copied to the publish directory: $fileName"
            }
          }

          $testRoot = Join-Path $env:RUNNER_TEMP "thermoscan-cross-platform"
          $parquetDirectory = Join-Path $testRoot "parquet"
          $tsvDirectory = Join-Path $testRoot "tsv"
          New-Item -ItemType Directory -Force -Path $parquetDirectory, $tsvDirectory | Out-Null
          # An existing output file must be replaced by the new one.
          Set-Content -Path (Join-Path $parquetDirectory "sample.ms1-trace.parquet") -Value "old output"

          $stderrFile = Join-Path $testRoot "parquet-stderr.txt"
          & $executable $fixture --name sample -o $parquetDirectory 2> $stderrFile
          $exitCode = $LASTEXITCODE
          $stderrText = Get-Content -Raw $stderrFile
          if ($exitCode -ne 0) {
            throw "Parquet extraction failed with exit code ${exitCode}: $stderrText"
          }
          # The fixture has only MS1 and MS2 scans, so no scan is skipped and nothing is reported.
          if (-not [string]::IsNullOrWhiteSpace($stderrText)) {
            throw "Expected no messages on standard error for the sample; got: $stderrText"
          }
          foreach ($fileName in @("sample.ms1-trace.parquet", "sample.msn-trace.parquet")) {
            $outputFile = Join-Path $parquetDirectory $fileName
            if (-not (Test-Path $outputFile -PathType Leaf) -or (Get-Item $outputFile).Length -eq 0) {
              throw "Expected non-empty Parquet output was not produced: $outputFile"
            }
            # Parquet files start and end with the magic bytes "PAR1".
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $outputFile))
            $head = [System.Text.Encoding]::ASCII.GetString($bytes, 0, 4)
            $tail = [System.Text.Encoding]::ASCII.GetString($bytes, $bytes.Length - 4, 4)
            if ($head -ne "PAR1" -or $tail -ne "PAR1") {
              throw "Output is not a complete Parquet file: $outputFile"
            }
          }

          # With --ms1, the MS1 file is written and an existing MSn file is left alone.
          $ms1OnlyDirectory = Join-Path $testRoot "ms1-only"
          New-Item -ItemType Directory -Force -Path $ms1OnlyDirectory | Out-Null
          $otherLevelFile = Join-Path $ms1OnlyDirectory "sample.msn-trace.parquet"
          Set-Content -Path $otherLevelFile -Value "not requested"
          & $executable $fixture --name sample --ms1 -o $ms1OnlyDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "MS1-only extraction failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path (Join-Path $ms1OnlyDirectory "sample.ms1-trace.parquet") -PathType Leaf)) {
            throw "MS1-only extraction did not write the MS1 file."
          }
          if ((Get-Content -Raw $otherLevelFile).Trim() -ne "not requested") {
            throw "MS1-only extraction changed the MSn file, which was not requested."
          }

          & $executable $fixture --name sample --tsv -o $tsvDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "TSV extraction failed with exit code $LASTEXITCODE."
          }
          $ms1Lines = @(Get-Content (Join-Path $tsvDirectory "sample.ms1-trace.tsv"))
          $msnLines = @(Get-Content (Join-Path $tsvDirectory "sample.msn-trace.tsv"))
          $ms1ScanIds = @($ms1Lines | Select-Object -Skip 1 | ForEach-Object { [int](($_ -split "`t")[0]) })
          $msnScanIds = @($msnLines | Select-Object -Skip 1 | ForEach-Object { [int](($_ -split "`t")[0]) })
          $expectedMsnScanIds = @(2..13) + @(15..26) + @(28..39)
          if (($ms1ScanIds -join ",") -ne "1,14,27") {
            throw "Expected MS1 scan IDs 1,14,27; got: $($ms1ScanIds -join ',')"
          }
          $invalidMsnRows = @($msnLines | Select-Object -Skip 1 | Where-Object { ($_ -split "`t")[4] -ne "2" })
          if (($msnScanIds -join ",") -ne ($expectedMsnScanIds -join ",") -or $invalidMsnRows.Count -ne 0) {
            throw "Expected MS2 scan IDs 2-13, 15-26, and 28-39; got: $($msnScanIds -join ',')"
          }

          $temporaryFiles = @(Get-ChildItem -Force -Recurse -Path $testRoot -Filter "*.tmp")
          if ($temporaryFiles.Count -ne 0) {
            throw "Temporary files were left behind: $($temporaryFiles.FullName -join ', ')"
          }

          Write-Host "Published ${{ matrix.runtime }} executable extracted the sample successfully: 3 MS1 and 36 MS2 scans."

      - name: Set up Python for the time zone check
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # RAW files store the clock time of the acquisition PC. The written time must not
      # depend on the time zone of the machine that runs the extraction.
      - name: Check acquisition time under different time zones
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --quiet pyarrow
          if ($LASTEXITCODE -ne 0) {
            throw "Could not install pyarrow."
          }

          $executable = "./artifacts/ci/${{ matrix.executable }}"
          $fixture = "./tests/data/thermo/exploris480_ms1_dia_3cycles.raw"
          $readMetadata = @'
          import sys
          import pyarrow.parquet as pq
          for path in sys.argv[1:]:
              metadata = pq.read_schema(path).metadata
              print(metadata[b'acquisition_start_time'].decode(), metadata[b'source_id'].decode())
          '@

          # Standard UTC offsets in hours; Auckland also moves 2026-09-30T11:46:56 to the next day.
          $expectedOffsets = @{ "UTC" = 0; "Pacific/Auckland" = 12 }
          foreach ($timeZone in @("UTC", "Pacific/Auckland")) {
            $outputDirectory = Join-Path $env:RUNNER_TEMP ("time-zone-" + ($timeZone -replace "/", "-"))
            $env:TZ = $timeZone
            # pwsh runs on .NET, so this proves that .NET sees the time zone set by TZ.
            $offset = pwsh -NoProfile -Command "[TimeZoneInfo]::Local.BaseUtcOffset.TotalHours"
            & $executable $fixture --name sample -o $outputDirectory
            $exitCode = $LASTEXITCODE
            Remove-Item Env:TZ
            if ([double]$offset -ne $expectedOffsets[$timeZone]) {
              throw "TZ=$timeZone had no effect on .NET: the local UTC offset is $offset hours."
            }
            if ($exitCode -ne 0) {
              throw "Extraction under TZ=$timeZone failed with exit code $exitCode."
            }

            $files = @("sample.ms1-trace.parquet", "sample.msn-trace.parquet") | ForEach-Object { Join-Path $outputDirectory $_ }
            $lines = @(python -c $readMetadata @files)
            if ($LASTEXITCODE -ne 0 -or $lines.Count -ne 2) {
              throw "Could not read the Parquet metadata written under TZ=$timeZone."
            }
            foreach ($line in $lines) {
              if ($line -ne "2026-09-30T11:46:56 MA10459C_20260930114656") {
                throw "Under TZ=$timeZone, expected acquisition_start_time 2026-09-30T11:46:56 and source_id MA10459C_20260930114656; got: $line"
              }
            }
            Write-Host "TZ=${timeZone}: acquisition_start_time and source_id are as expected."
          }
